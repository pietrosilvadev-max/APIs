<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>GameTrack</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>GameTrack</h1>

  <div class="dashboard">
    <p>Total: <strong id="total-jogos">0</strong></p>
    <p>Jogando: <strong id="total-jogando">0</strong></p>
    <p>Finalizados: <strong id="total-finalizados">0</strong></p>
  </div>

  <form id="form-jogo">
    <h3>Cadastrar / Editar Jogo</h3>
    
    <input type="text" id="titulo" placeholder="Título" required>
    <input type="text" id="genero" placeholder="Gênero" required>
    <input type="text" id="plataforma" placeholder="Plataforma" required>
    <input type="number" id="nota" min="0" max="10" placeholder="Nota (0 a 10)" required>
    
    <select id="status" required>
      <option value="Quero jogar">Quero jogar</option>
      <option value="Jogando">Jogando</option>
      <option value="Finalizado">Finalizado</option>
      <option value="Abandonado">Abandonado</option>
    </select>

    <button type="submit">Salvar</button>
  </form>

  <hr>

  <div class="filtros">
    <input type="text" id="pesquisa" placeholder="Pesquisar por título...">
    <select id="filtro-status">
      <option value="Todos">Todos os Status</option>
      <option value="Quero jogar">Quero jogar</option>
      <option value="Jogando">Jogando</option>
      <option value="Finalizado">Finalizado</option>
      <option value="Abandonado">Abandonado</option>
    </select>
  </div>

  <h2>Lista de Jogos</h2>
  <div id="lista-jogos" class="lista-jogos">

  </div>

  <script src="script.js"></script>
</body>
</html>
